# Full stack: `docker compose up --build` → http://localhost:8080
services:
  api:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      READVIBE_CORS_ORIGINS: '["http://localhost:8080"]'
    volumes:
      - readvibe-data:/data
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    depends_on: [api]
    ports:
      - "8080:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  readvibe-data:
