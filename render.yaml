# Render Blueprint for the ReadVibe API.
# Render dashboard → New → Blueprint → select this repo. The frontend stays on Vercel.
services:
  - type: web
    name: readvibe-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    # Free keeps sign-in available without requiring a billing account. Its filesystem
    # is ephemeral, so uploaded files and the SQLite database are reset after a restart.
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: READVIBE_ENVIRONMENT
        value: production
      - key: READVIBE_JWT_SECRET
        generateValue: true
      # DATABASE: the free plan's disk is wiped on every restart, so SQLite (the default) loses all accounts.
      # In the Render dashboard add READVIBE_DATABASE_URL = a free hosted Postgres URL (Supabase / Neon:
      # postgresql://user:pass@host:5432/db). It is left out of this file so a re-sync never overwrites it.
      - key: READVIBE_STORAGE_DIR
        value: /data/storage
      - key: READVIBE_MAX_UPLOAD_MB
        value: "5120"
      # Your Vercel production URL; *.vercel.app previews are also allowed by the API.
      - key: READVIBE_CORS_ORIGINS
        value: '["https://readvibecodex.vercel.app"]'
      - key: READVIBE_GOOGLE_CLIENT_ID
        sync: false          # set in the dashboard to enable Google sign-in
      - key: READVIBE_LLM_BASE_URL
        sync: false          # optional: your own OpenAI-compatible LLM (Groq, OpenRouter…); free public endpoints are used otherwise
      - key: READVIBE_LLM_API_KEY
        sync: false
      - key: READVIBE_LLM_MODEL
        sync: false
      - key: READVIBE_TRANSLATE_EMAIL
        sync: false          # optional: any real e-mail address lifts the free translation allowance (~5k -> ~50k characters/day)
