# Render's free plan puts the API to sleep after ~15 idle minutes; the next visitor then waits ~30 s.
# Ping it every 10 minutes so sign-in and registration stay instant.
name: keep-api-awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl --silent --show-error --fail --retry 5 --retry-delay 15 --max-time 90 https://readvibe-api.onrender.com/api/health
